name: AI Security Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Hent koden
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lagre diffen
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF"...HEAD -- . ':!.github' ':!scripts' > diff.txt

      - name: Installer Semgrep
        run: pipx install semgrep==1.177.0

      - name: Semgrep-skanning
        run: semgrep scan --config p/python --metrics=off --text --json-output=semgrep.json testcases/

      - name: AI-sikkerhetsgjennomgang
        if: github.actor != 'dependabot[bot]'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: https://api.groq.com/openai/v1/chat/completions
          AI_MODEL: openai/gpt-oss-120b
        run: python3 scripts/ai_review.py diff.txt

      - name: Kommenter på PR-en
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/post_comment.py findings.json
        
