name: AI Security Review

on:
  pull_request:

permissions:
  contents: read
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lagre diffen
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF"...HEAD -- . ':!.github' ':!scripts' > diff.txt

      - name: AI-sikkerhetsgjennomgang
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ai_review.py diff.txt
