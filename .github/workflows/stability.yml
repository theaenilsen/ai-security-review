name: Stabilitetstest

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Antall kjøringer"
        type: choice
        options: ["3", "5", "10"]
        default: "5"

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-24.04
    steps:
      - name: Hent koden
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lagre diffen
        run: git diff origin/main...HEAD -- . ':!.github' ':!scripts' ':!eval' > diff.txt

      - name: Kjør AI-gjennomgangen flere ganger
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: https://api.groq.com/openai/v1/chat/completions
          AI_MODEL: openai/gpt-oss-120b
          RUNS: ${{ inputs.runs }}
        run: |
          mkdir -p runs
          for i in $(seq 1 "$RUNS"); do
            echo "Kjøring $i av $RUNS"
            if ! python3 scripts/ai_review.py diff.txt > "runs/log_$i.txt"; then
              echo "Feilet (trolig rate limit). Venter 60 sekunder og prøver igjen."
              sleep 60
              python3 scripts/ai_review.py diff.txt > "runs/log_$i.txt"
            fi
            mv findings.json "runs/findings_$i.json"
            if [ "$i" -lt "$RUNS" ]; then sleep 65; fi
          done

      - name: Analyser stabiliteten
        run: python3 eval/stability.py eval/ground_truth.json runs/findings_*.json
